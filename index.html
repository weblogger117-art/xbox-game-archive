<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b0d0c"
    >

    <meta
        name="description"
        content="Meine persönliche Xbox-Spielebibliothek"
    >

    <title>Xbox Game Archive</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">

    <link
        rel="apple-touch-icon"
        href="images/icons/icon-192.png"
    >
</head>

<body>

    <header class="app-header">

        <div class="header-content">

            <div class="logo">
                <span class="logo-x">X</span>
                <span class="logo-text">XBOX GAME ARCHIVE</span>
            </div>

        </div>

    </header>


    <main class="app-content">

        <section class="hero">

            <h1>Meine Xbox-Sammlung</h1>

            <p>
                Dein persönliches Archiv für Xbox Classic,
                Xbox 360, Xbox One und Xbox Series.
            </p>

        </section>


        <section class="search-section">

            <label for="searchInput">
                Spiele suchen
            </label>

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Nach einem Spiel suchen..."
                    autocomplete="off"
                >

            </div>

        </section>


        <section class="filters">

            <div class="filter-group">

                <h2>Plattform</h2>

                <div class="filter-buttons">
                    <button class="filter-button active">
                        Alle
                    </button>

                    <button class="filter-button">
                        Xbox Classic
                    </button>

                    <button class="filter-button">
                        Xbox 360
                    </button>

                    <button class="filter-button">
                        Xbox One
                    </button>

                    <button class="filter-button">
                        Xbox Series
                    </button>
                </div>

            </div>


            <div class="filter-group">

                <h2>FSK</h2>

                <div class="filter-buttons">
                    <button class="filter-button active">
                        Alle
                    </button>

                    <button class="filter-button">0</button>
                    <button class="filter-button">6</button>
                    <button class="filter-button">12</button>
                    <button class="filter-button">16</button>
                    <button class="filter-button">18</button>
                </div>

            </div>


            <div class="filter-group">

                <h2>Genre</h2>

                <div class="filter-buttons">

                    <button class="filter-button active">
                        Alle
                    </button>

                    <button class="filter-button">
                        Action-Adventure
                    </button>

                    <button class="filter-button">
                        Beat 'em up
                    </button>

                    <button class="filter-button">
                        Couch-Coop
                    </button>

                    <button class="filter-button">
                        Ego Shooter
                    </button>

                    <button class="filter-button">
                        Family
                    </button>

                    <button class="filter-button">
                        Flight
                    </button>

                    <button class="filter-button">
                        Jump 'n Run
                    </button>

                    <button class="filter-button">
                        Party
                    </button>

                    <button class="filter-button">
                        Plattformer
                    </button>

                    <button class="filter-button">
                        Racer
                    </button>

                    <button class="filter-button">
                        Rollenspiele
                    </button>

                    <button class="filter-button">
                        Rundentaktik
                    </button>

                    <button class="filter-button">
                        Seafight
                    </button>

                    <button class="filter-button">
                        Sport
                    </button>

                    <button class="filter-button">
                        Survival
                    </button>

                    <button class="filter-button">
                        Survival-Horror
                    </button>

                    <button class="filter-button">
                        Third-Person-Shooter
                    </button>

                </div>

            </div>


            <div class="filter-group">

                <h2>Verfügbarkeit</h2>

                <div class="filter-buttons">

                    <button class="filter-button active">
                        Alle
                    </button>

                    <button class="filter-button">
                        Disc
                    </button>

                    <button class="filter-button">
                        Digital
                    </button>

                </div>

            </div>


            <div class="filter-group">

                <h2>Couch-Coop</h2>

                <div class="filter-buttons">

                    <button class="filter-button active">
                        Alle
                    </button>

                    <button class="filter-button">
                        Ja
                    </button>

                    <button class="filter-button">
                        Nein
                    </button>

                </div>

            </div>

        </section>


        <section class="game-counter">

            <span class="counter-number">0</span>

            <span class="counter-label">
                SPIELE GEFUNDEN
            </span>

        </section>


        <section class="games-section">

            <div id="gamesGrid" class="games-grid">

                <!-- Spiele werden später automatisch geladen -->

            </div>

        </section>

    </main>


    <footer class="app-footer">

        <span>Xbox Game Archive</span>

        <span>Private Collection</span>

    </footer>


    <script src="app.js"></script>

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register(
                    "service-worker.js"
                );

            });

        }

    </script>

</body>
</html>
